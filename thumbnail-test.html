<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thumbnail Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .thumbnail-test { 
            margin: 20px 0; 
            padding: 10px; 
            border: 1px solid #ccc; 
            border-radius: 5px;
        }
        img { 
            max-width: 200px; 
            border: 1px solid #999; 
            margin: 10px 0;
        }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>PDF Thumbnail Test</h1>
    
    <div class="thumbnail-test">
        <h3>Direct PNG Files:</h3>
        <p><strong>test_multipage_thumb.png</strong></p>
        <img src="thumbnails/test_multipage_thumb.png" alt="Test Multipage Thumbnail" 
             onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" />
        <p class="error" style="display:none;">Failed to load PNG thumbnail</p>
        
        <p><strong>5ML_Chemical Addiction_thumb.png</strong></p>
        <img src="thumbnails/5ML_Chemical Addiction_thumb.png" alt="5ML Chemical Addiction Thumbnail"
             onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" />
        <p class="error" style="display:none;">Failed to load PNG thumbnail</p>
    </div>

    <div class="thumbnail-test">
        <h3>API Endpoint Tests:</h3>
        <p><strong>API: test_multipage.pdf</strong></p>
        <img src="http://localhost:3001/api/thumbnail?path=/Volumes/Archives/Next-Label/database/Assta%20Label%20House/180%20x%20380/Q15020/files/test_multipage.pdf" 
             alt="API Test Multipage"
             onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" />
        <p class="error" style="display:none;">Failed to load from API</p>
        
        <p><strong>API: 5ML_Chemical Addiction.pdf</strong></p>
        <img src="http://localhost:3001/api/thumbnail?path=/Volumes/Archives/Next-Label/database/Assta%20Label%20House/180%20x%20380/Q15020/files/5ML_Chemical%20Addiction.pdf" 
             alt="API 5ML Chemical"
             onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" />
        <p class="error" style="display:none;">Failed to load from API</p>
    </div>

    <script>
        // Test API responses
        async function testApiEndpoints() {
            const testFiles = [
                'test_multipage.pdf',
                '5ML_Chemical Addiction.pdf',
                'Jobcard_J1254.pdf'
            ];
            
            for (const file of testFiles) {
                const encodedPath = encodeURIComponent(`/Volumes/Archives/Next-Label/database/Assta Label House/180 x 380/Q15020/files/${file}`);
                const url = `http://localhost:3001/api/thumbnail?path=${encodedPath}`;
                
                try {
                    const response = await fetch(url);
                    console.log(`${file}:`, {
                        status: response.status,
                        contentType: response.headers.get('content-type'),
                        pageCount: response.headers.get('x-pdf-page-count'),
                        multiPage: response.headers.get('x-pdf-multi-page')
                    });
                } catch (error) {
                    console.error(`${file} error:`, error);
                }
            }
        }
        
        testApiEndpoints();
    </script>
</body>
</html>

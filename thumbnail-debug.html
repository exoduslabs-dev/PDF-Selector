<!DOCTYPE html>
<html>
<head>
    <title>Thumbnail Debug Test</title>
</head>
<body>
    <h1>Thumbnail Debug Test</h1>
    <div id="result"></div>
    <div id="image-container"></div>
    
    <script>
        // Test the exact path that the frontend would use
        const filePath = '/Volumes/Archives/Next-Label/database/Assta Label House/180 x 380/Q15020/files/test_multipage.pdf';
        const encodedPath = encodeURIComponent(filePath);
        
        console.log('Original path:', filePath);
        console.log('Encoded path:', encodedPath);
        
        const apiUrl = `http://localhost:3001/api/thumbnail?filePath=${encodedPath}`;
        console.log('API URL:', apiUrl);
        
        // Test the API call
        fetch(apiUrl)
            .then(response => {
                console.log('Response status:', response.status);
                console.log('Response headers:', [...response.headers.entries()]);
                
                document.getElementById('result').innerHTML = `
                    <p>Response Status: ${response.status}</p>
                    <p>Content-Type: ${response.headers.get('content-type')}</p>
                    <p>PDF Page Count: ${response.headers.get('X-PDF-Page-Count')}</p>
                    <p>Multi-page: ${response.headers.get('X-PDF-Multi-Page')}</p>
                `;
                
                if (response.ok) {
                    return response.blob();
                } else {
                    throw new Error('Failed to load thumbnail');
                }
            })
            .then(blob => {
                const imageUrl = URL.createObjectURL(blob);
                const img = document.createElement('img');
                img.src = imageUrl;
                img.style.maxWidth = '300px';
                document.getElementById('image-container').appendChild(img);
                console.log('Image loaded successfully');
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('result').innerHTML += `<p style="color: red;">Error: ${error.message}</p>`;
            });
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Frontend API Debug Test</title>
</head>
<body>
    <h1>Frontend API Debug Test</h1>
    <div id="results"></div>
    
    <script>
        const API_BASE_URL = 'http://localhost:3001';
        const resultsDiv = document.getElementById('results');
        
        function log(message) {
            console.log(message);
            const p = document.createElement('p');
            p.textContent = message;
            resultsDiv.appendChild(p);
        }
        
        async function testFullFlow() {
            log('Starting full flow test...');
            
            try {
                // Step 1: Test get-files API
                log('Step 1: Testing get-files API...');
                const filesResponse = await fetch(`${API_BASE_URL}/api/get-files?customerName=Assta%20Label%20House&size=180%20x%20380&quoteId=Q15020`);
                
                if (!filesResponse.ok) {
                    log(`ERROR: get-files failed: ${filesResponse.status}`);
                    return;
                }
                
                const files = await filesResponse.json();
                log(`SUCCESS: Found ${files.length} files`);
                files.forEach(file => log(`  - ${file.filename} at ${file.filelocation}`));
                
                if (files.length === 0) {
                    log('No files found to test thumbnails with');
                    return;
                }
                
                // Step 2: Test thumbnail loading for each file
                log('Step 2: Testing thumbnail loading...');
                for (const file of files.slice(0, 2)) { // Test first 2 files only
                    log(`Testing thumbnail for: ${file.filename}`);
                    
                    const encodedPath = encodeURIComponent(file.filelocation);
                    const thumbnailUrl = `${API_BASE_URL}/api/thumbnail?filePath=${encodedPath}`;
                    
                    try {
                        const thumbnailResponse = await fetch(thumbnailUrl);
                        log(`  Response: ${thumbnailResponse.status} ${thumbnailResponse.statusText}`);
                        
                        if (thumbnailResponse.ok) {
                            const contentType = thumbnailResponse.headers.get('content-type');
                            const pageCount = thumbnailResponse.headers.get('X-PDF-Page-Count');
                            const isMultiPage = thumbnailResponse.headers.get('X-PDF-Multi-Page');
                            
                            log(`  Content-Type: ${contentType}`);
                            log(`  Page Count: ${pageCount}`);
                            log(`  Multi-page: ${isMultiPage}`);
                            
                            if (contentType && contentType.startsWith('image/')) {
                                const blob = await thumbnailResponse.blob();
                                const imageUrl = URL.createObjectURL(blob);
                                
                                const img = document.createElement('img');
                                img.src = imageUrl;
                                img.style.maxWidth = '200px';
                                img.style.border = '1px solid #ccc';
                                img.style.margin = '10px';
                                
                                const caption = document.createElement('div');
                                caption.textContent = `${file.filename} (${pageCount} pages)`;
                                caption.style.textAlign = 'center';
                                caption.style.fontSize = '12px';
                                
                                const container = document.createElement('div');
                                container.style.display = 'inline-block';
                                container.appendChild(img);
                                container.appendChild(caption);
                                
                                resultsDiv.appendChild(container);
                                log(`  SUCCESS: Thumbnail loaded and displayed`);
                            }
                        } else {
                            log(`  ERROR: Failed to load thumbnail`);
                        }
                    } catch (error) {
                        log(`  ERROR: ${error.message}`);
                    }
                }
                
                log('Test completed!');
                
            } catch (error) {
                log(`FATAL ERROR: ${error.message}`);
            }
        }
        
        // Start the test
        testFullFlow();
    </script>
</body>
</html>
